name: Patched Docker Image

on:
  push:
    branches:
      - patched

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TAG_SUFFIX: patched

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup environment
        run: cp .env.example .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build metadata
        id: meta
        run: |
          echo "version=$(jq -r .version packages/hoppscotch-backend/package.json)" >> $GITHUB_OUTPUT
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hoppscotch" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: prod.Dockerfile
          target: aio
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Single manifest without attestation children, so every untagged version is safe to delete
          provenance: false
          push: true
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-${{ env.TAG_SUFFIX }}
            ${{ steps.meta.outputs.image }}:latest-${{ env.TAG_SUFFIX }}

      - name: Delete untagged image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: hoppscotch
          package-type: container
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 0
